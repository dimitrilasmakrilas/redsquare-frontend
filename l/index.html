<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>redsquare - unlock your link</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--red:#d3221b;--bg:#0e0e0f;--panel:#161617;--line:#2c2c2e;--paper:#f2f2f2;--mute:#8e8e93;--ok:#6fd3a0;--bad:#ff8a80}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--paper);font:15px/1.55 system-ui,sans-serif;min-height:100vh}
h1,h2,h3{font-family:'Unbounded',system-ui,sans-serif;margin:0;letter-spacing:-.02em}
header{background:var(--red);padding:22px 20px}
header h1{max-width:640px;margin:0 auto;font-size:22px;font-weight:800;text-transform:lowercase;display:flex;align-items:center;gap:.5em}
.sq{width:.75em;height:.75em;background:var(--bg);flex:none;animation:in .5s ease-out both}
@keyframes in{from{transform:scale(0)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.sq{animation:none}}
main{max-width:640px;margin:0 auto;padding:36px 20px 64px}
.sub{margin:0 0 28px;color:var(--mute);max-width:52ch}
.card{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--red);padding:18px 20px;margin-bottom:14px}
label{display:block;font-weight:600;margin:0 0 6px}
input[type=text],input[type=url]{width:100%;padding:11px 12px;border:1px solid var(--line);background:var(--bg);color:var(--paper);font:inherit;border-radius:0}
input[type=text]:focus,input[type=url]:focus{border-color:var(--red);outline:none}
input:focus-visible,button:focus-visible{outline:2px solid var(--red);outline-offset:2px}
input[type=range]{width:100%;accent-color:var(--red)}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between}
.hint{color:var(--mute);font-size:13px;margin:6px 0 0}
code{background:#222;padding:1px 5px;font-size:12px}
button{font:inherit;font-weight:600;border:0;border-radius:0;padding:10px 18px;background:var(--red);color:#fff;cursor:pointer;transition:background .15s}
button:not(:disabled):hover{background:#e8362e}
button.ghost{background:transparent;color:var(--paper);border:1px solid var(--line)}
button.ghost:hover{background:#1f1f21!important}
button:disabled{opacity:.35;cursor:not-allowed}
.big{width:100%;padding:15px;font-size:16px}
.err{color:var(--bad)}.ok{color:var(--ok)}
.task{display:flex;gap:14px;align-items:center;justify-content:space-between}
.task h3{font-size:14px;font-weight:600}.task p{margin:3px 0 0;color:var(--mute);font-size:13px}.task button{min-width:88px}
.task.done{border-left-color:var(--ok)}.task.done button{background:transparent;color:var(--ok);border:1px solid var(--line)}
.ad{min-height:20px;margin:14px 0;text-align:center}

.card{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
main>:nth-child(2){animation-delay:.06s}main>:nth-child(3){animation-delay:.12s}main>:nth-child(4){animation-delay:.18s}main>:nth-child(5){animation-delay:.24s}
.sw{position:relative;flex:none;width:52px;height:28px;cursor:pointer;display:block;margin:0}
.sw input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.sw span{position:absolute;inset:0;background:var(--bg);border:1px solid var(--line);transition:background .25s,border-color .25s}
.sw span:before{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;background:var(--mute);transition:transform .35s cubic-bezier(.5,1.6,.4,1),background .25s}
.sw input:checked+span{background:var(--red);border-color:var(--red)}
.sw input:checked+span:before{transform:translateX(24px) rotate(90deg);background:#fff}
.sw input:focus-visible+span{outline:2px solid var(--red);outline-offset:3px}
input[type=range]{-webkit-appearance:none;appearance:none;height:28px;background:transparent;cursor:pointer;margin:6px 0 0;--p:50%}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:linear-gradient(to right,var(--red) var(--p),var(--line) var(--p))}
input[type=range]::-moz-range-track{height:4px;background:var(--line)}
input[type=range]::-moz-range-progress{height:4px;background:var(--red)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;background:#fff;border:3px solid var(--red);margin-top:-7px;transition:transform .15s}
input[type=range]::-moz-range-thumb{width:12px;height:12px;background:#fff;border:3px solid var(--red);border-radius:0}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.25) rotate(45deg)}
.reveal{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .45s cubic-bezier(.2,.8,.2,1),opacity .3s}
.reveal.open{grid-template-rows:1fr;opacity:1}.reveal>div{overflow:hidden;padding-top:0}.reveal.open>div{padding-top:16px}
button:not(:disabled):active{transform:scale(.97)}
.big{position:relative;overflow:hidden}
.big:not(:disabled):after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.25),transparent);transform:skewX(-20deg);animation:shine 3.2s ease-in-out infinite}
@keyframes shine{0%,55%{left:-60%}100%{left:130%}}
#out{animation:rise .4s cubic-bezier(.2,.8,.2,1) both}
.bar{height:3px;background:var(--line);margin:-14px 0 24px}.bar i{display:block;height:100%;width:0;background:var(--red);transition:width .7s cubic-bezier(.2,.8,.2,1)}
.task.done{animation:ok .8s ease-out}
@keyframes ok{0%{background:#1d3b2c;transform:scale(1.015)}100%{background:var(--panel);transform:none}}
#unlock:not(:disabled){animation:glow 1.8s ease-out infinite}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(211,34,27,.7)}100%{box-shadow:0 0 0 16px rgba(211,34,27,0)}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><header><h1><span class="sq"></span>redsquare</h1></header>
<main>
<p class="sub" id="prog">Loading...</p>
<div class="bar"><i id="fill"></i></div>
<div class="ad"><!-- paste ad network HTML/script here (top banner) --></div>
<div id="list"></div>
<button class="big" id="unlock" disabled>Unlock link</button>
<div class="ad"><!-- paste ad network HTML/script here (bottom banner) --></div>
</main><script>
var $=function(s){return document.querySelector(s)};
var id=location.pathname.split("/")[2],S,cur=0;
function api(p,b){return fetch("https://redsquare.xah.workers.dev/api/"+p,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(b)}).then(function(r){return r.json()})}
async function pow(ch,bits){for(var n=0;;n++){var h=new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(ch+":"+n)));var z=0;for(var i=0;i<h.length;i++){if(h[i]===0){z+=8;continue}z+=Math.clz32(h[i])-24;break}if(z>=bits)return n}}
function sync(){var bs=document.querySelectorAll(".task button");
 $("#prog").textContent=cur+" of "+S.tasks.length+" tasks done";$("#fill").style.width=(cur/S.tasks.length*100)+"%";$("#unlock").disabled=cur<S.tasks.length;
 for(var j=0;j<bs.length;j++)bs[j].disabled=(j!==cur||bs[j].dataset.busy==="1")}
async function run(t,d,b){
 b.dataset.busy="1";b.disabled=true;
 var w=window.open("about:blank","_blank");
 var r=await api("task/start",{sid:S.sid,i:t.i});
 if(r.error){if(w)w.close();b.dataset.busy="";b.disabled=false;b.textContent=r.error;return}
 if(w)w.location.href=r.url;else window.open(r.url,"_blank");
 var end=Date.now()+r.seconds*1000+500,p=pow(r.ch,r.bits);
 var iv=setInterval(function(){b.textContent=Math.max(0,Math.ceil((end-Date.now())/1000))+"s"},250);
 var n=await p;while(Date.now()<end)await new Promise(function(x){setTimeout(x,200)});
 clearInterval(iv);b.textContent="Checking";
 var k=await api("task/done",{sid:S.sid,i:t.i,n:n});
 b.dataset.busy="";
 if(k.error){b.textContent="Retry";b.disabled=false;return}
 d.classList.add("done");b.textContent="Done";cur++;sync();
}
(async function(){
 S=await api("session",{id:id});
 if(S.error){$("#prog").innerHTML='<span class="err"></span>';$("#prog").firstChild.textContent=S.error;return}
 S.tasks.forEach(function(t){var d=document.createElement("div");d.className="card task";d.style.animationDelay=(t.i*80)+"ms";d.innerHTML="<div><h3></h3><p></p></div><button>Start</button>";
  d.querySelector("h3").textContent=t.title;d.querySelector("p").textContent=t.desc;var b=d.querySelector("button");b.onclick=function(){run(t,d,b)};$("#list").appendChild(d)});
 sync();
})();
$("#unlock").onclick=async function(){$("#unlock").disabled=true;var r=await api("finish",{sid:S.sid});if(r.redirect)location.href=r.redirect;else{$("#prog").textContent=r.error;}};
</script></body></html>
